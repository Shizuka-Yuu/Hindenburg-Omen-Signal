name: WSJ Markets Diary Scraper

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    # ★ ubuntu-latest の代わりに、動作が安定している ubuntu-24.04 に固定します
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 安定稼働のため Node.js 22 を指定
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright and System Dependencies
        run: |
          npx playwright install chromium
          sudo npx playwright install-deps chromium

      - name: Run WSJ Scraper
        continue-on-error: true
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape.js

      - name: Run JPX Scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape_jpx.js
