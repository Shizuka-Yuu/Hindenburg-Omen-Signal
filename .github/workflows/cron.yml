name: WSJ Markets Diary Scraper

on:
  schedule:
    # 毎週月曜日から金曜日の UTC 20:30 (日本時間 翌午前5:30 / 米東部時間 午後4:30 EDT)
    # 米市場クローズ(16:00 EDT) → 16:15 EDT WSJ MarketDiary更新
   
    # 【夏時間用】3月第2日曜日〜11月第1日曜日まで有効
    - cron: '28 20 * * 1-5'
    
    # 【冬時間用メモ】11月になったら上記をコメントアウトし、以下を有効化する
    # - cron: '30 21 * * 1-5' # 日本時間 翌午前6:30 (冬時間の米市場クローズ16:00 EST → WSJ更新6:15 ESTの15分後)
  
  workflow_dispatch: # GitHubのUIから手動実行できるようにする

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run WSJ Scraper
        continue-on-error: true
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape.js

      - name: Run JPX Scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape_jpx.js
