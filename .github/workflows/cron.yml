name: WSJ Markets Diary Scraper

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ★ Playwright公式コンテナを指定（インストール処理が不要になります）
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ★ Install Playwright Chromium のステップは削除します（コンテナに同梱済みのため）

      - name: Run WSJ Scraper
        continue-on-error: true
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape.js

      - name: Run JPX Scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape_jpx.js
